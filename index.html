<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG — вращение с инерцией</title>
<style>
:root{color-scheme:light;--ink:#252525;--muted:#777;--paper:#f7f6f2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{width:min(100%,720px);text-align:center}.eyebrow{margin:0 0 12px;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
h1{margin:0;font-size:clamp(25px,5vw,38px);font-weight:500;letter-spacing:-.045em}
.hint{margin:12px auto 0;max-width:440px;color:var(--muted);font-size:14px;line-height:1.55}
.stage{min-height:390px;display:grid;place-items:center;margin:22px 0 12px;overflow:hidden;user-select:none;-webkit-user-select:none}
#spinner{width:min(64vw,290px);height:auto;max-height:330px;display:block;cursor:grab;transform:rotate(0deg);transform-origin:50% 50%;transform-box:fill-box;will-change:transform;user-select:none;-webkit-user-drag:none;touch-action:none;overflow:visible}
#spinner:active{cursor:grabbing}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
button,.upload-button{appearance:none;border:1px solid #d9d6cf;border-radius:999px;padding:10px 17px;background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;transition:background .2s,border-color .2s}
button:hover,.upload-button:hover{background:#eeece6;border-color:#bdb8ad}
input[type=file]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.note{min-height:18px;margin:17px 0 0;color:#99958c;font-size:11px;line-height:1.5}.note.error{color:#b34b3f}
@media(max-width:480px){.stage{min-height:310px}#spinner{width:min(72vw,260px);max-height:280px}}
</style>
</head>
<body>
<main>
<p class="eyebrow">Interactive SVG experiment</p>
<h1>Почувствуй вращение</h1>
<p class="hint">Зажми объект, потяни в сторону и отпусти. Он продолжит вращаться по инерции.</p>
<div class="stage" aria-label="Область интерактивного вращения">
<svg id="spinner" viewBox="0 0 300 300" role="img" aria-label="Золотая пятиконечная звезда" draggable="false" xmlns="http://www.w3.org/2000/svg">
<defs><filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset dy="7" result="offset"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<path d="M150 22 L181.7 111.5 L277 114.7 L202.5 174.3 L228.3 266 L150 212 L71.7 266 L97.5 174.3 L23 114.7 L118.3 111.5 Z" fill="#e6ad50" stroke="#bd8430" stroke-width="3" stroke-linejoin="round" filter="url(#softShadow)"/>
<path d="M150 40 L177 116 L258 119 L195 169 L217 246 L150 200 L83 246 L105 169 L42 119 L123 116 Z" fill="none" stroke="#f8d99e" stroke-width="2" opacity=".8" stroke-linejoin="round"/>
</svg>
</div>
<div class="controls">
<label class="upload-button" for="svgFile">Загрузить свой SVG</label>
<input id="svgFile" type="file" accept=".svg,image/svg+xml">
<button id="reset" type="button">Сбросить положение</button>
<button id="spin" type="button">Лёгкий толчок</button>
</div>
<p class="note" id="status" aria-live="polite">SVG можно загрузить с устройства · работает мышью и касанием</p>
</main>
<script>
(() => {
  const resetButton=document.getElementById('reset'), spinButton=document.getElementById('spin');
  const fileInput=document.getElementById('svgFile'), status=document.getElementById('status');
  const FRICTION=0.987, SENSITIVITY=0.85, MAX_VELOCITY=24;
  let object=document.getElementById('spinner'), angle=0, velocity=0, dragging=false;
  let lastX=0,lastTime=0,animationFrame=null,samples=[];

  const render=()=>{object.style.transform=`rotate(${angle}deg)`};
  const stopAnimation=()=>{if(animationFrame!==null){cancelAnimationFrame(animationFrame);animationFrame=null}};
  const animate=()=>{
    if(dragging)return;
    velocity*=FRICTION;
    if(Math.abs(velocity)<0.015){velocity=0;animationFrame=null;return}
    angle+=velocity;render();animationFrame=requestAnimationFrame(animate);
  };
  const startAnimation=()=>{stopAnimation();if(Math.abs(velocity)>0.015)animationFrame=requestAnimationFrame(animate)};

  const attachDrag=svg=>{
    svg.addEventListener('pointerdown',event=>{
      event.preventDefault();dragging=true;svg.setPointerCapture(event.pointerId);
      stopAnimation();velocity=0;lastX=event.clientX;lastTime=performance.now();samples=[];
    });
    svg.addEventListener('pointermove',event=>{
      if(!dragging)return;
      const now=performance.now(),deltaX=event.clientX-lastX,deltaTime=Math.max(1,now-lastTime);
      // Инвертировано по просьбе: SVG следует за движением руки.
      const deltaAngle=-deltaX*SENSITIVITY;
      angle+=deltaAngle;render();
      samples.push({velocity:deltaAngle/deltaTime*16.67,time:now});
      samples=samples.filter(sample=>now-sample.time<90);
      lastX=event.clientX;lastTime=now;
    });
    const endDrag=()=>{
      if(!dragging)return;dragging=false;
      if(samples.length){
        const total=samples.reduce((sum,sample)=>sum+sample.velocity,0);
        velocity=Math.max(-MAX_VELOCITY,Math.min(MAX_VELOCITY,total/samples.length));
      }
      startAnimation();
    };
    svg.addEventListener('pointerup',endDrag);
    svg.addEventListener('pointercancel',endDrag);
    svg.addEventListener('lostpointercapture',endDrag);
  };
  attachDrag(object);

  fileInput.addEventListener('change',event=>{
    const file=event.target.files&&event.target.files[0];if(!file)return;
    if(!/\.svg$/i.test(file.name)&&file.type!=='image/svg+xml'){
      status.textContent='Выбери файл с расширением .svg.';status.classList.add('error');fileInput.value='';return;
    }
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const parsed=new DOMParser().parseFromString(String(reader.result),'image/svg+xml');
        const source=parsed.documentElement;
        if(source.localName!=='svg'||parsed.querySelector('parsererror'))throw new Error('Invalid SVG');
        source.querySelectorAll('script,foreignObject,iframe,object,embed').forEach(node=>node.remove());
        [source,...source.querySelectorAll('*')].forEach(node=>{
          [...node.attributes].forEach(attr=>{
            const name=attr.name.toLowerCase(),value=attr.value.trim();
            if(name.startsWith('on'))node.removeAttribute(attr.name);
            if((name==='href'||name.endsWith(':href'))&&value&&!value.startsWith('#')&&!value.startsWith('data:image/'))node.removeAttribute(attr.name);
          });
        });
        const replacement=document.importNode(source,true);
        replacement.removeAttribute('width');replacement.removeAttribute('height');
        if(!replacement.hasAttribute('viewBox')){
          const w=parseFloat(source.getAttribute('width'))||300,h=parseFloat(source.getAttribute('height'))||300;
          replacement.setAttribute('viewBox',`0 0 ${w} ${h}`);
        }
        replacement.setAttribute('id','spinner');replacement.setAttribute('role','img');
        replacement.setAttribute('aria-label','Загруженный SVG');replacement.setAttribute('draggable','false');
        replacement.setAttribute('xmlns','http://www.w3.org/2000/svg');
        replacement.style.transform='rotate(0deg)';replacement.style.transformOrigin='50% 50%';replacement.style.transformBox='fill-box';
        stopAnimation();dragging=false;angle=0;velocity=0;
        object.replaceWith(replacement);object=replacement;attachDrag(object);render();
        status.textContent=`Загружен файл: ${file.name}`;status.classList.remove('error');
      }catch(error){
        status.textContent='Не удалось прочитать SVG. Проверь, что файл корректный.';status.classList.add('error');
      }
      fileInput.value='';
    };
    reader.onerror=()=>{status.textContent='Не удалось открыть файл.';status.classList.add('error');fileInput.value=''};
    reader.readAsText(file);
  });

  resetButton.addEventListener('click',()=>{dragging=false;stopAnimation();velocity=0;angle=0;render()});
  spinButton.addEventListener('click',()=>{
    dragging=false;velocity=velocity===0?-8:velocity+(velocity>0?5:-5);
    velocity=Math.max(-MAX_VELOCITY,Math.min(MAX_VELOCITY,velocity));startAnimation();
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG — вращение с инерцией</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #252525;
      --muted: #777;
      --paper: #f7f6f2;
      --accent: #e3a94b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 720px); text-align: center; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 38px);
      font-weight: 500;
      letter-spacing: -.045em;
    }
    .hint {
      margin: 12px auto 0;
      max-width: 430px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .stage {
      min-height: 390px;
      display: grid;
      place-items: center;
      margin: 22px 0 12px;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }
    #spinner {
      width: min(64vw, 290px);
      height: auto;
      display: block;
      cursor: grab;
      transform: rotate(0deg);
      transform-origin: 50% 50%;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
    }
    #spinner:active { cursor: grabbing; }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: 1px solid #d9d6cf;
      border-radius: 999px;
      padding: 10px 17px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    button:hover { background: #eeece6; border-color: #bdb8ad; }
    .note {
      min-height: 18px;
      margin: 17px 0 0;
      color: #99958c;
      font-size: 11px;
    }
    @media (max-width: 480px) {
      .stage { min-height: 310px; }
      #spinner { width: min(72vw, 260px); }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Interactive SVG experiment</p>
    <h1>Почувствуй вращение</h1>
    <p class="hint">Зажми звезду, потяни в сторону и отпусти. Чем быстрее движение, тем дольше она будет вращаться.</p>

    <div class="stage" aria-label="Область интерактивного вращения">
      <svg id="spinner" viewBox="0 0 300 300" role="img" aria-label="Золотая пятиконечная звезда" draggable="false">
        <defs>
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
            <feOffset dy="7" result="offset"/>
            <feComponentTransfer>
              <feFuncA type="linear" slope=".18"/>
            </feComponentTransfer>
            <feMerge>
              <feMergeNode/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <path d="M150 22 L181.7 111.5 L277 114.7 L202.5 174.3 L228.3 266 L150 212 L71.7 266 L97.5 174.3 L23 114.7 L118.3 111.5 Z"
              fill="#e6ad50" stroke="#bd8430" stroke-width="3" stroke-linejoin="round" filter="url(#softShadow)"/>
        <path d="M150 40 L177 116 L258 119 L195 169 L217 246 L150 200 L83 246 L105 169 L42 119 L123 116 Z"
              fill="none" stroke="#f8d99e" stroke-width="2" opacity=".8" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="controls">
      <button id="reset" type="button">Сбросить положение</button>
      <button id="spin" type="button">Лёгкий толчок</button>
    </div>
    <p class="note">Работает мышью и касанием · SVG можно заменить на свой</p>
  </main>

  <script>
    (() => {
      const object = document.getElementById('spinner');
      const resetButton = document.getElementById('reset');
      const spinButton = document.getElementById('spin');

      // Настройки поведения: их можно менять под нужное ощущение.
      const FRICTION = 0.987;       // ближе к 1 — дольше вращается
      const SENSITIVITY = 0.85;     // скорость поворота за движение указателя
      const MAX_VELOCITY = 24;      // ограничение скорости, градусов за кадр

      let angle = 0;
      let velocity = 0;
      let dragging = false;
      let lastX = 0;
      let lastTime = 0;
      let animationFrame = null;
      let samples = [];

      const render = () => {
        object.style.transform = `rotate(${angle}deg)`;
      };

      const stopAnimation = () => {
        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
      };

      const animate = () => {
        if (dragging) return;
        velocity *= FRICTION;
        if (Math.abs(velocity) < 0.015) {
          velocity = 0;
          animationFrame = null;
          return;
        }
        angle += velocity;
        render();
        animationFrame = requestAnimationFrame(animate);
      };

      const startAnimation = () => {
        stopAnimation();
        if (Math.abs(velocity) > 0.015) {
          animationFrame = requestAnimationFrame(animate);
        }
      };

      object.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        dragging = true;
        object.setPointerCapture(event.pointerId);
        stopAnimation();
        velocity = 0;
        lastX = event.clientX;
        lastTime = performance.now();
        samples = [];
      });

      object.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        const now = performance.now();
        const deltaX = event.clientX - lastX;
        const deltaTime = Math.max(1, now - lastTime);

        // Перетаскивание по горизонтали превращается во вращение.
        const deltaAngle = deltaX * SENSITIVITY;
        angle += deltaAngle;
        render();

        samples.push({ velocity: deltaAngle / deltaTime * 16.67, time: now });
        samples = samples.filter(sample => now - sample.time < 90);
        lastX = event.clientX;
        lastTime = now;
      });

      const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        if (samples.length) {
          const total = samples.reduce((sum, sample) => sum + sample.velocity, 0);
          velocity = total / samples.length;
          velocity = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, velocity));
        }
        startAnimation();
      };

      object.addEventListener('pointerup', endDrag);
      object.addEventListener('pointercancel', endDrag);
      object.addEventListener('lostpointercapture', endDrag);

      resetButton.addEventListener('click', () => {
        dragging = false;
        stopAnimation();
        velocity = 0;
        angle = 0;
        render();
      });

      spinButton.addEventListener('click', () => {
        dragging = false;
        velocity = velocity === 0 ? 8 : velocity + (velocity > 0 ? 5 : -5);
        velocity = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, velocity));
        startAnimation();
      });
    })();
  </script>
</body>
</html>
